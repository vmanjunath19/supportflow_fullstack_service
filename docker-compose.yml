services:
  supportflow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: supportflow-api:1.0.0
    container_name: supportflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
      LOG_LEVEL: "INFO"
      SLA_POLL_INTERVAL_SECONDS: "60"
      RETRY_POLL_INTERVAL_SECONDS: "30"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s