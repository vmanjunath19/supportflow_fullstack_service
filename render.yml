services:
  - type: web
    name: supportflow-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SLA_POLL_INTERVAL_SECONDS
        value: "60"
      - key: RETRY_POLL_INTERVAL_SECONDS
        value: "30"
      # Auto-generated cryptographically strong 256-bit webhook secret on Render
      - key: WEBHOOK_SECRET
        generateValue: true
      # Sensitive credentials entered securely in Render Dashboard (never committed to Git)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false